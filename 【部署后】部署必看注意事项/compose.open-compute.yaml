services:
  open-compute:
    environment:
      TCMALLOC_RELEASE_RATE: "10"
    image: ghcr.io/observe-life/open-compute:0.3.0-stallfix1
    pull_policy: never
    container_name: open-compute
    restart: unless-stopped
    command: ["--system", "run"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /vol1/docker/open-compute/data:/var/lib/open-compute
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    stop_grace_period: 60s

networks:
  backend:
    external: true
    name: backend
