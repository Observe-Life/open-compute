services:
  open-compute:
    image: ghcr.io/elliothux/open-compute:0.3.0
    pull_policy: never
    container_name: open-compute
    restart: unless-stopped
    command: ["--system", "run"]
    volumes:
      - /vol1/docker/open-compute/data:/var/lib/open-compute
    networks:
      - backend

networks:
  backend:
    external: true
    name: backend
